<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
    <style>
      .blog-list {
  max-width: 900px;
  margin: 40px auto;
  padding: 0 20px;
}

.blog-post {
  display: flex;
  align-items: flex-start;
  gap: 20px;
  margin-bottom: 40px;
  border-bottom: 1px solid #ddd;
  padding-bottom: 20px;
}

.blog-post img {
  width: 250px;
  height: 160px;
  object-fit: cover;
  border-radius: 8px;
}

.blog-content h2 {
  margin: 0;
  font-size: 22px;
}

.blog-content h2 a {
  color: #0073e6;
  text-decoration: none;
}

.blog-content h2 a:hover {
  text-decoration: underline;
}

.blog-content .date {
  color: #666;
  font-size: 14px;
  margin: 5px 0 10px;
}

.blog-content p {
  font-size: 16px;
  line-height: 1.6;
  color: #444;
}

    </style>
</head>

</html>
