<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advertisement Shoot</title>
</head>
<style>
    body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background: #fff;
    text-align: center;
    background-color:aliceblue;
  }

  .brand-section {
    padding: 50px 20px;
  }

  .brand-section h2 {
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 40px;
    color: #222;
  }

  .brand-logos {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 30px;
    max-width: 1000px;
    margin: 0 auto;
    align-items: center;
  }
  .brand{
    color: #222;
    font-size: 10px;
  }

  .brand-logos img {
    max-width: 140px;
    height: auto;
    margin: 0 auto;
    display: block;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .brand-logos img:hover {
    transform: scale(1.1);
    box-shadow: 0 8px 16px rgba(0,0,0,0.2);
  }

</style>
<body>
  <div id="header"></div>
    <section class="brand-section">
    <h2>Advertisement Shoot</h2>
    <div class="brand-logos">
    <div class="brand">
      <img src="#" alt="Branding">
      <p>ecommerce</p>
    </div>
    <div class="brand">
      <img src="#" alt=" Social Media Content">
      <p>#</p>
    </div>
    <div class="brand">
      <img src="#" alt=" Reels & Ad Video">
      <p>#</p>
    </div>
    <div class="brand">
      <img src="#" alt="Seasonal Theme">
      <p>#</p>
    </div>
    <div class="brand">
      <img src="#" alt=" Creative Concept">
      <p>#</p>
    </div>
    
      
    </div>
  </section>
  <div id="contact"></div>
    <script src="script.js"></script>
</body>
</html>
